<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Летопись Героя</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=MedievalSharp&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #d4a94e;
      --gold-bright: #f5d47a;
      --parchment: #1a1410;
      --panel: #241a12;
      --ink: #e8d9b5;
      --cell-empty: #3a2c1c;
      --cell-fill: linear-gradient(180deg, #f5d47a, #b8860b);
      --danger: #a33b2e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Cinzel', serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse at top, #2e2214 0%, #120d08 60%, #0a0705 100%);
    }

    h1 {
      font-family: 'MedievalSharp', cursive;
      text-align: center;
      font-size: 2.2rem;
      margin: 24px 0 6px;
      color: var(--gold-bright);
      text-shadow: 0 0 14px rgba(245, 212, 122, .45), 0 2px 2px #000;
      letter-spacing: 2px;
    }

    .subtitle {
      text-align: center;
      font-size: .95rem;
      opacity: .7;
      margin-bottom: 28px;
    }

    .app {
      display: flex;
      gap: 32px;
      max-width: 1200px;
      margin: 0 auto 40px;
      padding: 0 20px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    /* ===== Левая панель: кузня характеристик ===== */
    .forge {
      flex: 1 1 460px;
      border: 2px solid var(--gold);
      border-radius: 14px;
      padding: 22px;
      background:
        linear-gradient(160deg, rgba(212,169,78,.08), transparent 55%),
        var(--panel);
      box-shadow:
        inset 0 0 30px rgba(0,0,0,.7),
        0 0 22px rgba(212,169,78,.25);
    }

    .forge h2 {
      font-family: 'MedievalSharp', cursive;
      margin: 0 0 4px;
      color: var(--gold-bright);
      font-size: 1.4rem;
      text-align: center;
      letter-spacing: 1px;
    }

    .forge .hint {
      text-align: center;
      font-size: .8rem;
      opacity: .6;
      margin: 0 0 18px;
    }

    .stat-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 12px;
      border: 1px solid rgba(212,169,78,.35);
      border-radius: 10px;
      margin-bottom: 14px;
      background: rgba(0,0,0,.35);
    }

    .stat-name {
      flex: 0 0 130px;
      font-size: .95rem;
      letter-spacing: .5px;
    }

    /* Уровень в большом круге */
    .level-orb {
      flex: 0 0 58px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 35% 30%, #6b4f1d, #241a12 70%);
      border: 2px solid var(--gold);
      box-shadow: 0 0 14px rgba(245,212,122,.35), inset 0 0 10px rgba(0,0,0,.8);
      user-select: none;
    }
    .level-orb .lvl-label {
      font-size: .55rem;
      letter-spacing: 1px;
      opacity: .75;
      text-transform: uppercase;
    }
    .level-orb .lvl-value {
      font-family: 'MedievalSharp', cursive;
      font-size: 1.5rem;
      line-height: 1;
      color: var(--gold-bright);
      text-shadow: 0 0 8px rgba(245,212,122,.6);
    }

    /* Прогресс из квадратиков */
    .cells {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 4px;
      height: 26px;
    }
    .cell {
      border-radius: 3px;
      border: 1px solid rgba(212,169,78,.4);
      background: var(--cell-empty);
      box-shadow: inset 0 1px 3px rgba(0,0,0,.8);
      transition: background .25s, box-shadow .25s;
    }
    .cell.filled {
      background: var(--cell-fill);
      box-shadow: 0 0 8px rgba(245,212,122,.55), inset 0 1px 1px rgba(255,255,255,.4);
    }
    .cell.burst {
      animation: burst .45s ease;
    }
    @keyframes burst {
      0%   { transform: scale(1.6); box-shadow: 0 0 22px rgba(245,212,122,.95); }
      100% { transform: scale(1); }
    }

    /* Стрелки вверх/вниз */
    .arrows {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .arrow-btn {
      width: 38px;
      height: 26px;
      border: 1px solid var(--gold);
      border-radius: 6px;
      background: linear-gradient(180deg, #3a2c1c, #241a12);
      color: var(--gold-bright);
      font-size: 1rem;
      cursor: pointer;
      transition: background .15s, transform .1s;
    }
    .arrow-btn:hover { background: linear-gradient(180deg, #57431f, #332514); }
    .arrow-btn:active { transform: scale(.92); }
    .arrow-btn:disabled { opacity: .3; cursor: default; transform: none; }

    /* ===== Правая часть: паутинка ===== */
    .web-panel {
      flex: 1 1 460px;
      border: 2px solid var(--gold);
      border-radius: 14px;
      padding: 22px;
      background:
        linear-gradient(200deg, rgba(212,169,78,.06), transparent 60%),
        var(--panel);
      box-shadow:
        inset 0 0 30px rgba(0,0,0,.7),
        0 0 22px rgba(212,169,78,.25);
    }
    .web-panel h2 {
      font-family: 'MedievalSharp', cursive;
      margin: 0 0 12px;
      color: var(--gold-bright);
      font-size: 1.4rem;
      text-align: center;
      letter-spacing: 1px;
    }
    canvas { display: block; margin: 0 auto; }

    @media (max-width: 900px) {
      .app { flex-direction: column; }
    }
  </style>
</head>
<body>

  <h1>⚔ Летопись Героя ⚔</h1>
  <p class="subtitle">Повышай характеристики — и паутина твоей судьбы расправит крылья</p>

  <div class="app">
    <!-- ЛЕВАЯ ЧАСТЬ: повышение характеристик (обособлено рамкой) -->
    <section class="forge">
      <h2>Кузня характеристик</h2>
      <p class="hint">Каждые 10 очков куют новый уровень</p>
      <div id="stats"></div>
    </section>

    <!-- ПРАВАЯ ЧАСТЬ: паутинка характеристик -->
    <section class="web-panel">
      <h2>Паутина Судьбы</h2>
      <canvas id="radar" width="520" height="520"></canvas>
    </section>
  </div>

  <script>
    // ==== Конфигурация характеристик ====
    const stats = [
      { name: 'Сила',        cat: 'physical',       total: 0 },
      { name: 'Выносливость',cat: 'physical',       total: 0 },
      { name: 'Воля',        cat: 'psychological',  total: 0 },
      { name: 'Мудрость',    cat: 'psychological',  total: 0 },
      { name: 'Интеллект',   cat: 'mental',         total: 0 },
      { name: 'Память',      cat: 'mental',         total: 0 }
    ];

    const CELLS = 10; // ячеек в прогресс-баре

    const levelOf = s => 1 + Math.floor(s.total / CELLS);
    const cellsOf = s => s.total % CELLS;

    // ==== Отрисовка левой панели ====
    function renderStats() {
      const container = document.getElementById('stats');
      container.innerHTML = '';

      stats.forEach(s => {
        const row = document.createElement('div');
        row.className = 'stat-row';

        // Круг уровня
        const orb = document.createElement('div');
        orb.className = 'level-orb';
        orb.innerHTML = `<span class="lvl-label">ур.</span><span class="lvl-value">${levelOf(s)}</span>`;

        // Прогресс из квадратиков
        const cells = document.createElement('div');
        cells.className = 'cells';
        const filled = cellsOf(s);
        for (let i = 0; i < CELLS; i++) {
          const c = document.createElement('div');
          c.className = 'cell' + (i < filled ? ' filled' : '');
          cells.appendChild(c);
        }

        // Стрелки вверх/вниз
        const arrows = document.createElement('div');
        arrows.className = 'arrows';
        const up = document.createElement('button');
        up.className = 'arrow-btn';
        up.textContent = '▲';
        up.addEventListener('click', () => change(s, +1, cells));
        const down = document.createElement('button');
        down.className = 'arrow-btn';
        down.textContent = '▼';
        down.disabled = s.total <= 0;
        down.addEventListener('click', () => change(s, -1, cells));
        arrows.append(up, down);

        const name = document.createElement('div');
        name.className = 'stat-name';
        name.textContent = s.name;

        row.append(name, orb, cells, arrows);
        container.appendChild(row);
      });
      drawRadar();
    }

    function change(s, delta, cellsEl) {
      s.total = Math.max(0, s.total + delta);

      // Момент кузни: уровень вырос — подсветим вспышкой
      const grew = levelOf(s) > (s._prevLevel || 1);
      s._prevLevel = levelOf(s);

      if (grew && cellsEl) {
        const first = cellsEl.querySelector('.cell.filled');
        if (first) first.classList.add('burst');
      }
      renderStats();
    }

    // ==== Паутинка (radar chart) на canvas ====
    function drawRadar() {
      const canvas = document.getElementById('radar');
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;
      const cx = W / 2, cy = H / 2;
      const R = Math.min(W, H) / 2 - 60;
      const n = stats.length;

      ctx.clearRect(0, 0, W, H);

      // Максимум уровня для масштаба: растёт вместе с героем
      const maxLevel = Math.max(5, ...stats.map(levelOf));

      // Паутинные кольца (уровни)
      ctx.strokeStyle = 'rgba(212,169,78,.25)';
      ctx.lineWidth = 1;
      for (let ring = 1; ring <= maxLevel; ring++) {
        ctx.beginPath();
        for (let i = 0; i <= n; i++) {
          const a = (i % n) * (2 * Math.PI / n) - Math.PI / 2;
          const r = R * ring / maxLevel;
          const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
          i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      // Лучи к вершинам
      stats.forEach((s, i) => {
        const a = i * (2 * Math.PI / n) - Math.PI / 2;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + R * Math.cos(a), cy + R * Math.sin(a));
        ctx.stroke();

        // Подписи характеристик
        const lx = cx + (R + 26) * Math.cos(a);
        const ly = cy + (R + 26) * Math.sin(a);
        ctx.fillStyle = '#e8d9b5';
        ctx.font = '15px Cinzel, serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`${s.name} [${levelOf(s)}]`, lx, ly);
      });

      // Полигон значений — лучи соединены между собой
      const poly = stats.map((s, i) => {
        const a = i * (2 * Math.PI / n) - Math.PI / 2;
        // радиус = уровень + заполнение текущей ячейки, для живости паутины
        const v = levelOf(s) + cellsOf(s) / CELLS;
        const r = R * v / maxLevel;
        return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
      });

      // Свечение под полигоном
      const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, R);
      grad.addColorStop(0, 'rgba(245,212,122,.45)');
      grad.addColorStop(1, 'rgba(163,59,46,.35)');

      ctx.beginPath();
      poly.forEach(([x, y], i) => i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y));
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.strokeStyle = '#f5d47a';
      ctx.lineWidth = 2.5;
      ctx.shadowColor = 'rgba(245,212,122,.8)';
      ctx.shadowBlur = 14;
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Вершины-руны
      poly.forEach(([x, y]) => {
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, 2 * Math.PI);
        ctx.fillStyle = '#f5d47a';
        ctx.shadowColor = 'rgba(245,212,122,.9)';
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0;
      });
    }

    renderStats();
  </script>
</body>
</html>
